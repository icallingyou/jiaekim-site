# 사진 크기 자동 채우기: Pages CMS 로 사진을 올리거나 내용을 저장하면
# 사진의 가로·세로 픽셀을 _data/*.yml 에 채워 넣어 갤러리 줄 높이가 맞도록 합니다.
name: Fill image sizes

on:
  push:
    branches: [main]
    paths:
      - "_data/**"
      - "images/**"

permissions:
  contents: write

jobs:
  fill:
    # 이 워크플로가 만든 커밋으로는 다시 실행되지 않도록
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill in missing w/h
        run: python3 scripts/fill_image_sizes.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data
          git commit -m "사진 크기 자동 입력 (image sizes)"
          git push
