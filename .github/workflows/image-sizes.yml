# 사진 크기 자동 기록: Pages CMS 로 사진을 올리거나 내용을 저장하면
# 사진의 가로·세로 픽셀을 _data/image_sizes.yml 에 기록해 갤러리 줄 높이가 맞도록 합니다.
# 소유자가 편집하는 파일(_data/works.yml 등)은 건드리지 않습니다.
name: Record image sizes

on:
  push:
    branches: [main]
    paths:
      - "_data/**"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-sizes
  cancel-in-progress: false

jobs:
  record:
    # 이 워크플로가 만든 커밋으로는 다시 실행되지 않도록
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record sizes into _data/image_sizes.yml
        run: python3 scripts/fill_image_sizes.py
      - name: Commit and push if the map changed
        run: |
          if git diff --quiet -- _data/image_sizes.yml && [ -z "$(git ls-files --others --exclude-standard _data/image_sizes.yml)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/image_sizes.yml
          git commit -m "사진 크기 기록 (image sizes)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $attempt), rebasing on the latest main"
            git pull --rebase origin main || exit 1
          done
          git push
