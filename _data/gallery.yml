# 작품 섹션의 안내 문구 — Pages CMS 의 '작품 섹션 문구'에서 편집됩니다.
sub_kr: 분채와 먹, 한지 — 모든 작품은 전통 재료로 제작되었습니다. 그림을 누르면 크게 볼 수 있습니다.
sub_en: "All works: ground mineral & shell pigment (bunchae) and ink on hanji. Tap a painting to view it larger."
study_title_kr: 재현 모사 — 박물관 소장 옛 그림을 따라 그린 수련작
study_title_en: Studies after museum paintings (*jaehyeon*)
study_text_kr: 조선의 민화는 이름 없는 화가들이 손에서 손으로 본을 옮기며 전해졌습니다. 재현 모사는 그 전승 방식 그대로 옛 그림을 한 폭씩 따라 그리는 수련이며, 위의 작품들은 이 수련 위에서 새로 구성한 그림들입니다.
study_text_en: "Joseon folk painting was passed from hand to hand by anonymous painters copying model drawings. *Jaehyeon* is that training: painting a museum-held original panel by panel. The works above are my own compositions built on it."
