# 소개 · 약력 — Pages CMS 의 '소개 · 약력'에서 편집됩니다.
lead_kr: 안녕하세요, 뉴욕 퀸즈 베이사이드에서 민화를 그리는 김지애입니다.
lead_en: I am a minhwa painter based in Bayside, Queens.
body_kr: |-
  <p>조선 후기 민화의 전통 그대로 — 돌과 조개를 갈아 만든 분채를 아교에 개어, 한지 위에 얇게 여러 번 쌓아 올립니다.</p>
  <p>민화는 본래 집안의 그림이었습니다. 모란은 부귀를, 연꽃은 맑음을, 원앙 한 쌍은 화목을 빌었지요. 그림마다 담긴 이 복(福)의 언어를 오늘의 퀸즈로 옮겨 그리는 것이 제 작업입니다 — 처음에는 한인 이민 가정을 위해, 이제는 출신을 가리지 않는 이웃들을 위해.</p>
  <p>형식을 현대화하지는 않습니다. 바꾸는 것은 그림이 누구를 위한 것인가입니다.</p>
  <p>지닐민화 조현주 선생님 문하에서 수학했으며, K-Color Link의 창립 리드 아티스트로 퀸즈 곳곳에서 한·영 이중언어 무료 민화 워크숍을 엽니다. 2026년에는 베이사이드 역사협회(BHS Castle)에서 전시 <em>Moon and Bloom</em>을 기획하고 2주간 오픈 스튜디오 레지던시를 했습니다.</p>
body_en: |-
  <p>I work in the late-Joseon Korean folk painting tradition with its original materials: ground mineral and shell pigments (bunchae) bound with hide glue, built up in thin layers on handmade hanji paper.</p>
  <p>Minhwa was the painting of the household. Peonies wished a family wealth and honor, the lotus purity, a pair of mandarin ducks harmony. My work carries that language of blessing into present-day Queens — first for Korean immigrant households, now for neighbors of every origin.</p>
  <p>I do not modernize the form; I change whom it is for.</p>
  <p>I trained in the Jinil Minhwa lineage under master painter Hyun-joo Cho. As founding lead artist of the K-Color Link collective I lead free bilingual minhwa workshops across Queens, and in 2026 I organized <em>Moon and Bloom</em> at the Bayside Historical Society, with a two-week open-studio residency.</p>
quote_kr: 호(號)는 시우(時雨) — '때맞춰 내리는 비'라는 뜻입니다. 그림이 누군가의 벽에서, 꼭 필요한 순간에 내리는 단비가 되기를 바라는 마음을 담았습니다.
quote_en: I paint under the artist name Si-Woo (時雨) — "timely rain" — in the hope that each painting arrives on someone's wall at just the moment it is needed.
